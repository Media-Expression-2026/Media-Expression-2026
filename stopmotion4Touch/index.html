<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitive Reset</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000; color: #00ff88;
            font-family: monospace; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none;
        }
        #canvas-view {
            width: 480px; height: 360px; border: 2px solid #333;
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
        }
        #hud { margin-top: 20px; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div id="canvas-view"></div>

    <div id="hud">
        <div id="status">[ CLICK SCREEN TO START ]</div>
        <div style="margin-top: 5px; color: #888;">SPACE: TOGGLE SPEED</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
