<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Primitive Sync System</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000; color: #00ff88;
            font-family: monospace; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        /* コア・ビューポート */
        #canvas-view {
            width: 100%; max-width: 480px; height: 360px; border: 2px solid #333;
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; position: relative; background-color: #050505;
        }
        /* 物理的な透明ボタンエリア（バグ回避の核心） */
        .touch-btn {
            width: 100%; height: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 11px; color: #444; cursor: pointer; box-sizing: border-box;
            background: rgba(0,0,0,0.01); /* タッチ反応用の不可視背景 */
        }
        #btn-speed { border-bottom: 1px silent #111; } /* 上半分 */
        #btn-toggle { } /* 下半分 */

        #hud { margin-top: 20px; text-align: center; font-size: 14px; height: 20px; }
    </style>
</head>
<body>

    <div id="canvas-view">
        <div id="btn-speed" class="touch-btn">[ TAP: TOGGLE SPEED ]</div>
        <div id="btn-toggle" class="touch-btn">[ TAP: PLAY / PAUSE ]</div>
    </div>

    <div id="hud">
        <div id="status">[ READY ]</div>
    </div>

    <script>
        // 1. 素材の定義
        const images = ['assets/photo1.jpg', 'assets/photo2.jpg', 'assets/photo3.jpg'];
        const primitiveAudio = new Audio('week5/shot.mp3');

        // 2. 状態管理
        let currentIndex = 0;
        let frameCounter = 0;
        let isRunning = false; 
        let intervals =[60, 30, 5]; // フレーム間隔の選択肢
        let currentIntervalIndex = 0;

        const view = document.getElementById('canvas-view');
        const statusText = document.getElementById('status');
        const btnSpeed = document.getElementById('btn-speed');
        const btnToggle = document.getElementById('btn-toggle');

        statusText.innerText = "[ TAP LOWER AREA TO START ]";

        // 3. 同期発火
        function triggerSync() {
            view.style.backgroundImage = `url('${images[currentIndex]}')`;
            primitiveAudio.currentTime = 0;
            primitiveAudio.play().catch(e => console.log(e));
            currentIndex = (currentIndex + 1) % images.length;
        }

        // 4. メインループ
        function systemLoop() {
            if (!isRunning) return; 
            frameCounter++;
            let pace = intervals[currentIntervalIndex];
            if (frameCounter % pace === 0) {
                triggerSync();
            }
            requestAnimationFrame(systemLoop);
        }

        // 5. 変速アクション（上半分）
        function doSpeed(e) {
            if (e) e.preventDefault();
            if (isRunning) {
                currentIntervalIndex = (currentIntervalIndex + 1) % intervals.length;
                statusText.innerText = `[ RUNNING / PACE : ${intervals[currentIntervalIndex]} frames ]`;
            }
        }

        // 6. 再生・停止アクション（下半分）
        function doToggle(e) {
            if (e) e.preventDefault();
            if (!isRunning) {
                isRunning = true;
                statusText.innerText = `[ RUNNING / PACE : ${intervals[currentIntervalIndex]} frames ]`;
                triggerSync();
                frameCounter = 0;
                systemLoop();  
            } else {
                isRunning = false;
                statusText.innerText = `[ PAUSED ]`;
            }
        }

        // 7. イベントバインド（スマホ・PC両対応、競合なし）
        // スマホ用
        btnSpeed.addEventListener('touchstart', doSpeed, { passive: false });
        btnToggle.addEventListener('touchstart', doToggle, { passive: false });

        // PC用クリック
        btnSpeed.addEventListener('click', (e) => {
            if (!('ontouchstart' in window)) doSpeed(e);
        });
        btnToggle.addEventListener('click', (e) => {
            if (!('ontouchstart' in window)) doToggle(e);
        });

        // PC用スペースキー
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isRunning) {
                e.preventDefault();
                doSpeed();
            }
        });
    </script>
</body>
</html>
