<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitive Sync System</title>
    <style>
        body {
            margin: 0; padding: 0; background: #000; color: #00ff88;
            font-family: monospace; display: flex; flex-direction: column;
            justify-content: center; align-items: center; height: 100vh;
            overflow: hidden; user-select: none;
        }
        #canvas-view {
            width: 100%; max-width: 480px; height: 360px; border: 2px solid #333;
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center;
            position: relative; background-color: #050505;
        }
        #canvas-view::before {
            content: "[ TAP UPPER: TOGGLE SPEED ]"; position: absolute; top: 10px; font-size: 11px; color: #444;
        }
        #canvas-view::after {
            content: "[ TAP LOWER: PLAY / PAUSE ]"; position: absolute; bottom: 10px; font-size: 11px; color: #444;
        }
        #hud { margin-top: 20px; text-align: center; font-size: 14px; height: 20px; }
    </style>
</head>
<body>

    <div id="canvas-view"></div>
    <div id="hud">
        <div id="status">[ READY ]</div>
    </div>

    <script>
        const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const src = isTouch ? 'mobile.js' : 'pc.js';
        
        const script = document.createElement('script');
        script.src = src;
        document.body.appendChild(script);
    </script>
</body>
</html>
