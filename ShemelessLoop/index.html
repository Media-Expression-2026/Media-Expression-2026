<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scroll Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loop-container">
        <div class="loop-group">
            <img src="assets/photo1.jpg" alt="Photo 1">
            <img src="assets/photo2.jpg" alt="Photo 2">
            <img src="assets/photo3.jpg" alt="Photo 3">
        </div>
        
        <div class="loop-group" aria-hidden="true">
            <img src="assets/photo1.jpg" alt="Photo 1">
            <img src="assets/photo2.jpg" alt="Photo 2">
            <img src="assets/photo3.jpg" alt="Photo 3">
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
