<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>墨文字表現ツール — マルチメディア表現II</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#080808; --bg2:#111; --line:rgba(255,255,255,0.08);
  --dim:rgba(255,255,255,0.25); --mid:rgba(255,255,255,0.55);
  --fg:rgba(255,255,255,0.88); --mono:'Courier New',monospace;
}
body{background:#000;color:var(--fg);font-family:var(--mono);overflow:hidden;}

/* canvas layers */
#gl-canvas{ position:fixed;inset:0;width:100%;height:100%;}
#p5-canvas{ position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
/* 単色背景オーバーレイ */
#bg-canvas{ position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}

/* drop zone */
#dropzone{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(8,8,8,0.92);z-index:50;
  cursor:pointer;border:1px solid var(--line);
  transition:background 0.2s;
}
#dropzone:hover{background:rgba(20,20,20,0.95);}
#dropzone h1{font-size:13px;letter-spacing:0.2em;color:var(--fg);margin-bottom:16px;font-weight:normal;}
#dropzone .sub{font-size:10px;color:var(--dim);letter-spacing:0.15em;line-height:2;text-align:center;}
#dropzone .box{
  margin-top:28px;width:240px;height:120px;
  border:1px dashed rgba(255,255,255,0.2);border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--dim);letter-spacing:0.12em;
  transition:border-color 0.2s;
}
#dropzone.drag-over .box{border-color:rgba(255,255,255,0.5);}
#file-input{display:none;}

/* mode bar */
#modebar{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;align-items:stretch;
  background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  z-index:20;
}
.mode-btn{
  flex:1;padding:14px 8px 12px;
  border:none;background:none;color:var(--dim);
  font-family:var(--mono);font-size:9px;letter-spacing:0.1em;
  cursor:pointer;border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:background 0.15s,color 0.15s;
}
.mode-btn:last-child{border-right:none;}
.mode-btn:hover{background:rgba(255,255,255,0.04);color:var(--mid);}
.mode-btn.active{background:rgba(255,255,255,0.07);color:var(--fg);}
.mode-btn .num{font-size:14px;letter-spacing:0;}
.mode-btn .label{font-size:8px;letter-spacing:0.1em;text-align:center;line-height:1.5;}

/* hint */
#hint{
  position:fixed;top:16px;right:20px;
  font-size:9px;color:var(--dim);letter-spacing:0.1em;line-height:2;
  pointer-events:none;z-index:20;text-align:right;
}

/* info overlay */
#info{
  position:fixed;top:16px;left:20px;
  font-size:9px;color:var(--dim);letter-spacing:0.1em;
  pointer-events:none;z-index:20;
}

/* bg switcher */
#bgbar{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  display:none;
  align-items:center;gap:6px;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;z-index:20;
}
#bgbar .bg-label{
  font-size:8px;letter-spacing:0.14em;color:var(--dim);margin-right:4px;
}
.bg-btn{
  width:20px;height:20px;border-radius:50%;
  border:2px solid transparent;cursor:pointer;
  transition:border-color 0.15s,transform 0.1s;
  flex-shrink:0;
}
.bg-btn:hover{transform:scale(1.15);}
.bg-btn.active{border-color:rgba(255,255,255,0.7);}
</style>
</head>
<body>

<canvas id="gl-canvas"></canvas>
<canvas id="bg-canvas"></canvas>
<canvas id="p5-canvas"></canvas>

<div id="dropzone">
  <h1>墨文字表現ツール</h1>
  <div class="sub">
    マルチメディア表現II / INS300A<br>
    背景を切り抜いたPNG（墨文字）をドロップ<br>
    または クリックして選択
  </div>
  <div class="box">画像をここにドロップ</div>
  <input type="file" id="file-input" accept="image/*">
</div>

<div id="modebar" style="display:none;">
  <button class="mode-btn active" data-mode="0">
    <span class="num">A</span>
    <span class="label">パーティクル<br>飛散・再集合</span>
  </button>
  <button class="mode-btn" data-mode="1">
    <span class="num">B</span>
    <span class="label">シェーダー<br>背景と重ねる</span>
  </button>
  <button class="mode-btn" data-mode="2">
    <span class="num">C</span>
    <span class="label">雨のように<br>降らせる</span>
  </button>
  <button class="mode-btn" data-mode="3">
    <span class="num">D</span>
    <span class="label">文字マスク<br>内側に波紋</span>
  </button>
  <button class="mode-btn" data-mode="4">
    <span class="num">E</span>
    <span class="label">筆で書かれる<br>アニメーション</span>
  </button>
</div>

<div id="hint" style="display:none;">
  マウス移動 → 変化<br>
  クリック → 効果<br>
  1〜5 キー → モード切替<br>
  S → スペースキーで保存
</div>

<div id="bgbar">
  <span class="bg-label">背景</span>
  <button class="bg-btn active" data-bg="shader" title="シェーダー" style="background:linear-gradient(135deg,#1a1a4a,#0a4a2a);"></button>
  <button class="bg-btn" data-bg="#000000" title="黒" style="background:#000;"></button>
  <button class="bg-btn" data-bg="#ffffff" title="白" style="background:#fff;"></button>
  <button class="bg-btn" data-bg="#f5f0e8" title="和紙" style="background:#f5f0e8;"></button>
  <button class="bg-btn" data-bg="#1a0a00" title="濃茶" style="background:#1a0a00;"></button>
  <button class="bg-btn" data-bg="#0a0a2a" title="深藍" style="background:#0a0a2a;"></button>
  <button class="bg-btn" data-bg="#1a0a1a" title="深紫" style="background:#1a0a1a;"></button>
  <button class="bg-btn" data-bg="#002a00" title="深緑" style="background:#002a00;"></button>
</div>

<div id="info" style="display:none;"></div>

<script>
// ── globals ──────────────────────────────────────────────────
var img = null;         // HTMLImageElement
var imgData = null;     // ImageData（ピクセル読み取り用）
var mode = 0;
var W, H;
var mouse = {x:0.5, y:0.5, px:0.5, py:0.5, down:false};

var glCanvas  = document.getElementById('gl-canvas');
var bgCanvas  = document.getElementById('bg-canvas');
var p5Canvas  = document.getElementById('p5-canvas');
var gl        = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
var ctx       = p5Canvas.getContext('2d');
var bgCtx     = bgCanvas.getContext('2d');

// ── resize ───────────────────────────────────────────────────
function resize(){
  W = innerWidth; H = innerHeight;
  glCanvas.width = W; glCanvas.height = H;
  bgCanvas.width = W; bgCanvas.height = H;
  p5Canvas.width = W; p5Canvas.height = H;
  gl.viewport(0,0,W,H);
}
window.addEventListener('resize', function(){ resize(); if(img) rebuildMode(); });
resize();

// ── drop / file ──────────────────────────────────────────────
var dz = document.getElementById('dropzone');
dz.addEventListener('click', function(){ document.getElementById('file-input').click(); });
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', function(){ dz.classList.remove('drag-over'); });
dz.addEventListener('drop', function(e){
  e.preventDefault(); dz.classList.remove('drag-over');
  var file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')) loadFile(file);
});
document.getElementById('file-input').addEventListener('change', function(e){
  if(e.target.files[0]) loadFile(e.target.files[0]);
});

function loadFile(file){
  var reader = new FileReader();
  reader.onload = function(e){
    var image = new Image();
    image.onload = function(){
      img = image;
      // ImageData取得用の一時キャンバス
      var tmp = document.createElement('canvas');
      tmp.width = img.width; tmp.height = img.height;
      var tc = tmp.getContext('2d');
      tc.drawImage(img, 0, 0);
      imgData = tc.getImageData(0, 0, img.width, img.height);
      dz.style.display = 'none';
      document.getElementById('modebar').style.display = 'flex';
      document.getElementById('bgbar').style.display = 'flex';
      document.getElementById('hint').style.display = 'block';
      document.getElementById('info').style.display = 'block';
      initGL();
      rebuildMode();
      requestAnimationFrame(loop);
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ── mode switch ──────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    setMode(parseInt(btn.dataset.mode));
  });
});

window.addEventListener('keydown', function(e){
  if(e.key>='1'&&e.key<='5') setMode(parseInt(e.key)-1);
  if(e.key==='s'||e.key==='S') saveFrame();
});

function setMode(m){
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(function(b,i){
    b.classList.toggle('active', i===m);
  });
  // B(1)とD(3)はシェーダー背景専用 → 背景バーを非表示・強制シェーダー
  if(m===1 || m===3){
    document.getElementById('bgbar').style.display = 'none';
    bgMode = 'shader';
    glCanvas.style.opacity = '1';
  } else {
    document.getElementById('bgbar').style.display = img ? 'flex' : 'none';
  }
  rebuildMode();
}

// ── mouse ────────────────────────────────────────────────────
window.addEventListener('mousemove', function(e){
  mouse.px = mouse.x; mouse.py = mouse.y;
  mouse.x = e.clientX/W; mouse.y = 1-e.clientY/H;
});
window.addEventListener('mousedown', function(){ mouse.down=true; });
window.addEventListener('mouseup',   function(){ mouse.down=false; });

// ─────────────────────────────────────────────────────────────
//  WebGL shader background
// ─────────────────────────────────────────────────────────────
var glProg = null;
var glTex  = null;

var VS_SRC = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';

var FS_SHADER = `
precision highp float;
uniform vec2 R; uniform float T; uniform vec2 M; uniform int MODE;
uniform sampler2D uTex; uniform vec2 uTexSize;
#define PI 3.14159265

vec3 hsv(float h,float s,float v){
  vec4 K=vec4(1.,2./3.,1./3.,3.);
  vec3 p=abs(fract(h+K.xyz)*6.-K.www);
  return v*mix(K.xxx,clamp(p-K.xxx,0.,1.),s);
}
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
}
vec2 rot(vec2 p,float a){return vec2(p.x*cos(a)-p.y*sin(a),p.x*sin(a)+p.y*cos(a));}

void main(){
  vec2 uv=(gl_FragCoord.xy-R*.5)/min(R.x,R.y);
  // UNPACK_FLIP_Y_WEBGL でテクスチャのY反転は修正済み
  vec2 uvn=vec2(gl_FragCoord.x/R.x, gl_FragCoord.y/R.y);
  float t=T;
  vec3 col=vec3(0.);

  // サイマティクス背景（全モード共通）
  vec2 uv2=rot(uv,t*.03)*1.4;
  float mx=M.x*2.-1.,my=M.y*2.-1.;
  float n=5.+mx*3.,m=7.+my*3.;
  float w=sin(n*PI*uv2.x+t)*sin(m*PI*uv2.y)+sin(m*PI*uv2.x-t*.7)*sin(n*PI*uv2.y+t*.3);
  float nd=1.-smoothstep(0.,.2,abs(w));
  float g=pow(nd,3.);
  col=mix(hsv(.6,.4,.02),hsv(.55+w*.1,.7,g),g);

  if(MODE==1){
    // B: テクスチャブレンド
    vec4 tc=texture2D(uTex,uvn);
    // 黒文字PNG: アルファが高くRGBが暗い部分 = 墨
    float ink=tc.a*(1.0-tc.r);
    col=mix(col, vec3(0.02,0.02,0.05), ink*0.9);
  }
  if(MODE==3){
    // D: マスク — 黒い墨部分の内側にシェーダーを強調表示
    vec4 tc=texture2D(uTex,uvn);
    float ink=tc.a*(1.0-tc.r); // 0=透明/白, 1=黒い墨
    // 墨の内側: シェーダーを明るく・鮮やかに
    float glow=pow(nd,1.5)*2.0;
    vec3 inside=hsv(0.5+w*0.3+t*0.02, 1.0, glow);
    // 墨の外側: 暗く抑える
    col=mix(col*0.05, inside, ink);
    // 輪郭を光らせる
    float edge=ink*(1.0-ink)*4.0;
    col+=hsv(0.15+t*0.01, 0.8, edge*0.8);
  }

  gl_FragColor=vec4(col,1.);
}`;

function mkShader(type,src){
  var s=gl.createShader(type);
  gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

function initGL(){
  if(glProg) gl.deleteProgram(glProg);
  glProg=gl.createProgram();
  gl.attachShader(glProg,mkShader(gl.VERTEX_SHADER,VS_SRC));
  gl.attachShader(glProg,mkShader(gl.FRAGMENT_SHADER,FS_SHADER));
  gl.linkProgram(glProg);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(glProg,'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  // texture（Y軸反転を修正）
  glTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,glTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}

var startTime = performance.now();
function renderGL(){
  if(!glProg) return;
  gl.useProgram(glProg);
  var t=(performance.now()-startTime)/1000;
  gl.uniform2f(gl.getUniformLocation(glProg,'R'),W,H);
  gl.uniform1f(gl.getUniformLocation(glProg,'T'),t);
  gl.uniform2f(gl.getUniformLocation(glProg,'M'),mouse.x,mouse.y);
  gl.uniform1i(gl.getUniformLocation(glProg,'MODE'),mode);
  gl.uniform1i(gl.getUniformLocation(glProg,'uTex'),0);
  gl.uniform2f(gl.getUniformLocation(glProg,'uTexSize'),img.width,img.height);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// ─────────────────────────────────────────────────────────────
//  2D canvas modes
// ─────────────────────────────────────────────────────────────

// ── A: パーティクル ──────────────────────────────────────────
var particles=[];
var PARTICLE_COUNT=3000;

function samplePixels(){
  // 黒いピクセルをサンプリング
  var pts=[];
  var d=imgData.data, iw=imgData.width, ih=imgData.height;
  var scaleX=W*0.5/iw, scaleY=H*0.7/ih;
  var scale=Math.min(scaleX,scaleY);
  var ox=(W-iw*scale)/2, oy=(H-ih*scale)/2;
  for(var y=0;y<ih;y+=3){
    for(var x=0;x<iw;x+=3){
      var i=(y*iw+x)*4;
      var a=d[i+3], r=d[i];
      if(a>100 && r<100){ // 黒くて不透明
        pts.push({x:ox+x*scale, y:oy+y*scale});
      }
    }
  }
  return pts;
}

function initParticles(){
  particles=[];
  var pts=samplePixels();
  for(var i=0;i<PARTICLE_COUNT;i++){
    var target=pts[Math.floor(Math.random()*pts.length)];
    particles.push({
      x: Math.random()*W, y: Math.random()*H,
      tx: target.x, ty: target.y,
      vx:0, vy:0,
      size: Math.random()*2.5+0.5,
      alpha: Math.random()*0.5+0.5,
    });
  }
}

function updateParticles(){
  var mx=mouse.x*W, my=(1-mouse.y)*H;
  var scatter=mouse.down;
  particles.forEach(function(p){
    var dx=p.tx-p.x, dy=p.ty-p.y;
    if(scatter){
      var ddx=p.x-mx, ddy=p.y-my;
      var dist=Math.sqrt(ddx*ddx+ddy*ddy)+1;
      var force=Math.min(200/dist,8);
      p.vx+=ddx/dist*force;
      p.vy+=ddy/dist*force;
    } else {
      p.vx+=dx*0.08;
      p.vy+=dy*0.08;
    }
    p.vx*=0.82; p.vy*=0.82;
    p.x+=p.vx; p.y+=p.vy;
  });
}

function drawParticles(){
  var light = bgMode === '#ffffff' || bgMode === '#f5f0e8';
  particles.forEach(function(p){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle = light
      ? 'rgba(0,0,0,'+p.alpha+')'
      : 'rgba(255,255,255,'+p.alpha+')';
    ctx.fill();
  });
}

// ── B: シェーダー背景 + 画像重ね（GL側で処理、2Dは何もしない）
function drawBlend(){
  ctx.clearRect(0,0,W,H);
}

// ── C: 雨のように降らせる ──────────────────────────────────
var rainDrops=[];
function initRain(){
  rainDrops=[];
  var iw=img.width, ih=img.height;
  var scale=Math.min(W*0.25/iw, H*0.35/ih);
  for(var i=0;i<18;i++){
    var s=scale*(0.4+Math.random()*0.8);
    rainDrops.push({
      x: Math.random()*W,
      y: -ih*s*Math.random(),
      s: s,
      speed: 0.8+Math.random()*2.5,
      alpha: 0.15+Math.random()*0.6,
      rot: (Math.random()-0.5)*0.3,
    });
  }
}

function drawRain(){
  ctx.clearRect(0,0,W,H);
  rainDrops.forEach(function(d){
    d.y+=d.speed;
    if(d.y>H+img.height*d.s){
      d.y=-img.height*d.s;
      d.x=Math.random()*W;
      d.s=Math.min(W*0.25/img.width,H*0.35/img.height)*(0.4+Math.random()*0.8);
      d.alpha=0.15+Math.random()*0.6;
    }
    ctx.save();
    ctx.globalAlpha=d.alpha;
    ctx.translate(d.x,d.y);
    ctx.rotate(d.rot);
    ctx.drawImage(img,-img.width*d.s/2,-img.height*d.s/2,img.width*d.s,img.height*d.s);
    ctx.restore();
  });
}

// ── D: マスク（GL側で処理、2Dは何もしない）
function drawMaskMode(){
  ctx.clearRect(0,0,W,H);
}

// ── E: 筆で書かれる ────────────────────────────────────────
var drawProgress=0;
var drawPts=[];
var drawSpeed=0.003;

function initDraw(){
  // 黒いピクセルを左上から右下へ走査してパスを作る
  drawPts=[];
  var d=imgData.data, iw=imgData.width, ih=imgData.height;
  var scaleX=W*0.55/iw, scaleY=H*0.75/ih;
  var scale=Math.min(scaleX,scaleY);
  var ox=(W-iw*scale)/2, oy=(H-ih*scale)/2;
  // 行ごとにジグザグに走査
  for(var y=0;y<ih;y+=2){
    var row=[];
    for(var x=0;x<iw;x+=2){
      var i=(y*iw+x)*4;
      if(d[i+3]>80&&d[i]<100) row.push({x:ox+x*scale,y:oy+y*scale});
    }
    if(y%4===2) row.reverse();
    drawPts=drawPts.concat(row);
  }
  drawProgress=0;
}

function drawWriting(){
  // 背景クリアはloop側で処理済み
  drawProgress=Math.min(drawProgress+drawSpeed,1);
  var count=Math.floor(drawProgress*drawPts.length);
  if(count<2) return;
  // 完成した部分を描画
  var light = bgMode === '#ffffff' || bgMode === '#f5f0e8';
  ctx.fillStyle = light ? 'rgba(10,10,20,0.9)' : 'rgba(20,20,30,0.85)';
  for(var i=0;i<count;i++){
    var p=drawPts[i];
    var r=1.2+Math.sin(i*0.05)*0.5;
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();
  }
  // 筆先の光
  if(count<drawPts.length){
    var tip=drawPts[count];
    ctx.beginPath();
    ctx.arc(tip.x,tip.y,6,0,Math.PI*2);
    ctx.fillStyle='rgba(150,220,255,0.8)';
    ctx.fill();
  }
  // ループ
  if(drawProgress>=1){
    setTimeout(function(){ drawProgress=0; },1500);
  }
}

// ── mode info ────────────────────────────────────────────────
var MODE_INFO=[
  'A｜パーティクル — クリックで飛散、離すと再集合',
  'B｜シェーダー重ね — マウスで波形が変化',
  'C｜雨 — 文字が降ってくる',
  'D｜マスク — 文字の形の中にシェーダーが走る',
  'E｜筆書き — 文字が書かれていくアニメーション',
];

function updateInfo(){
  document.getElementById('info').textContent=MODE_INFO[mode];
}

// ── bg switcher ──────────────────────────────────────────────
var bgMode = 'shader'; // 'shader' or hex color

document.querySelectorAll('.bg-btn').forEach(function(btn){
  btn.addEventListener('click', function(){
    bgMode = btn.dataset.bg;
    document.querySelectorAll('.bg-btn').forEach(function(b){
      b.classList.toggle('active', b===btn);
    });
  });
});

function renderBG(){
  if(bgMode === 'shader'){
    // WebGL shaderをそのまま描画
    glCanvas.style.display = 'block';
    renderGL();
  } else {
    // 単色背景
    glCanvas.style.display = 'none';
    ctx.save();
    ctx.fillStyle = bgMode;
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

// ── rebuild on mode change ───────────────────────────────────
function rebuildMode(){
  if(!img) return;
  ctx.clearRect(0,0,W,H);
  if(mode===0) initParticles();
  if(mode===2) initRain();
  if(mode===4) initDraw();
  updateInfo();
}

// ── main loop ────────────────────────────────────────────────
function loop(){
  // 1. GL背景（シェーダー）
  if(bgMode === 'shader'){
    glCanvas.style.opacity = '1';
    renderGL();
    bgCtx.clearRect(0,0,W,H);
  } else {
    // GL非表示、bg-canvasに単色
    glCanvas.style.opacity = '0';
    bgCtx.fillStyle = bgMode;
    bgCtx.fillRect(0,0,W,H);
  }

  // 2. p5-canvasをクリア（透明）してモード描画
  ctx.clearRect(0,0,W,H);
  if(mode===0){ updateParticles(); drawParticles(); }
  if(mode===1){ drawBlend(); }
  if(mode===2){ drawRain(); }
  if(mode===3){ drawMaskMode(); }
  if(mode===4){ drawWriting(); }

  requestAnimationFrame(loop);
}

// ── save ─────────────────────────────────────────────────────
function saveFrame(){
  // GL + 2D を合成して保存
  var tmp=document.createElement('canvas');
  tmp.width=W; tmp.height=H;
  var tc=tmp.getContext('2d');
  // readPixels
  var pixels=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  var id=tc.createImageData(W,H);
  for(var y=0;y<H;y++){
    var src=(H-1-y)*W*4;
    id.data.set(pixels.subarray(src,src+W*4),y*W*4);
  }
  tc.putImageData(id,0,0);
  tc.drawImage(p5Canvas,0,0);
  tmp.toBlob(function(blob){
    var a=document.createElement('a');
    var ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.download='sumi_m'+(mode+1)+'_'+ts+'.png';
    a.href=URL.createObjectURL(blob);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  },'image/png');
}
</script>
