<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>尊い — テキスト表現ツール</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Hiragino Sans','Yu Gothic',sans-serif;}

#gl{position:fixed;inset:0;width:100%;height:100%;}
#cv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}

/* UI */
#ui{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.08);
  padding:14px 20px;z-index:20;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
#word-input{
  flex:1;min-width:160px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:4px;padding:8px 12px;
  color:#fff;font-size:14px;font-family:inherit;
  outline:none;
}
#word-input::placeholder{color:rgba(255,255,255,0.25);}
#word-input:focus{border-color:rgba(255,255,255,0.35);}

.ui-btn{
  padding:8px 14px;border:1px solid rgba(255,255,255,0.15);
  background:none;color:rgba(255,255,255,0.6);
  font-family:inherit;font-size:11px;letter-spacing:0.1em;
  border-radius:3px;cursor:pointer;white-space:nowrap;
  transition:background 0.15s,color 0.15s;
}
.ui-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.ui-btn.active{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.35);}

.mode-group{display:flex;gap:4px;}

#hint{
  position:fixed;top:14px;right:16px;
  font-size:9px;color:rgba(255,255,255,0.2);
  letter-spacing:0.1em;line-height:2;
  font-family:'Courier New',monospace;
  pointer-events:none;z-index:20;text-align:right;
}

/* word tags */
#wordlist{
  display:flex;flex-wrap:wrap;gap:6px;
  max-width:320px;
}
.wtag{
  font-size:10px;padding:3px 8px;
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;color:rgba(255,255,255,0.5);
  cursor:pointer;transition:background 0.1s;
  font-family:inherit;
}
.wtag:hover{background:rgba(255,255,255,0.1);color:#fff;}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<canvas id="cv"></canvas>

<div id="hint">
  Enter / クリック → 言葉を追加<br>
  スペース → 爆発<br>
  C → クリア<br>
  S → PNG保存<br>
  1〜4 → モード切替
</div>

<div id="ui">
  <input id="word-input" type="text" placeholder="言葉を入れる（例：尊い、無理、滾る…）" maxlength="20">
  <button class="ui-btn" id="btn-add">追加</button>

  <div class="mode-group">
    <button class="ui-btn active" data-mode="0">流れる</button>
    <button class="ui-btn" data-mode="1">崩れる</button>
    <button class="ui-btn" data-mode="2">爆発</button>
    <button class="ui-btn" data-mode="3">静寂→爆発</button>
  </div>

  <div id="wordlist">
    <span class="wtag">尊い</span>
    <span class="wtag">無理</span>
    <span class="wtag">滾る</span>
    <span class="wtag">解釈一致</span>
    <span class="wtag">沼</span>
    <span class="wtag">距離感バグ</span>
    <span class="wtag">死んだ</span>
    <span class="wtag">CP</span>
    <span class="wtag">尊死</span>
    <span class="wtag">待って</span>
  </div>
</div>

<script>
// ── WebGL shader ─────────────────────────────────────────────
var glc = document.getElementById('gl');
var gl  = glc.getContext('webgl') || glc.getContext('experimental-webgl');
var cv  = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W, H;

var VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var FS = `
precision highp float;
uniform vec2 R; uniform float T; uniform float INTENSITY;
#define PI 3.14159265
vec3 hsv(float h,float s,float v){
  vec4 K=vec4(1.,2./3.,1./3.,3.);
  vec3 p=abs(fract(h+K.xyz)*6.-K.www);
  return v*mix(K.xxx,clamp(p-K.xxx,0.,1.),s);
}
vec2 rot(vec2 p,float a){return vec2(p.x*cos(a)-p.y*sin(a),p.x*sin(a)+p.y*cos(a));}
void main(){
  vec2 uv=(gl_FragCoord.xy-R*.5)/min(R.x,R.y);
  uv=rot(uv,T*.02)*1.3;
  float n=5.+sin(T*.1)*2., m=7.+cos(T*.13)*2.;
  float w=sin(n*PI*uv.x+T)*sin(m*PI*uv.y)+sin(m*PI*uv.x-T*.7)*sin(n*PI*uv.y+T*.3);
  float nd=1.-smoothstep(0.,.18,abs(w));
  float g=pow(nd,2.5)*INTENSITY;
  // ピンク〜紫系のカラーパレット
  vec3 col=mix(
    hsv(.75,.5,.02),
    hsv(.82+w*.08,.9,g),
    g
  );
  gl_FragColor=vec4(col,1.);
}`;

function mkS(t,s){
  var sh=gl.createShader(t);
  gl.shaderSource(sh,s);gl.compileShader(sh);
  if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(sh));
  return sh;
}
var prog=gl.createProgram();
gl.attachShader(prog,mkS(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,mkS(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);gl.useProgram(prog);
var buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var aloc=gl.getAttribLocation(prog,'a');
gl.enableVertexAttribArray(aloc);
gl.vertexAttribPointer(aloc,2,gl.FLOAT,false,0,0);

function resize(){
  W=innerWidth;H=innerHeight;
  glc.width=W;glc.height=H;
  cv.width=W;cv.height=H;
  gl.viewport(0,0,W,H);
}
window.addEventListener('resize',resize);resize();

var t0=performance.now();
var intensity=1.0;

function renderGL(){
  gl.useProgram(prog);
  var t=(performance.now()-t0)/1000;
  gl.uniform2f(gl.getUniformLocation(prog,'R'),W,H);
  gl.uniform1f(gl.getUniformLocation(prog,'T'),t);
  gl.uniform1f(gl.getUniformLocation(prog,'INTENSITY'),intensity);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

// ── text particles ───────────────────────────────────────────
var words = ['尊い'];
var particles = [];
var mode = 0;
var silenceTimer = 0;
var exploding = false;

function Particle(word, x, y, mode){
  this.word = word;
  this.x = x || Math.random()*W;
  this.y = y || Math.random()*H;
  this.vx = (Math.random()-0.5)*3;
  this.vy = (Math.random()-0.5)*2 - (mode===2?8:1);
  this.alpha = 1;
  this.size = 14 + Math.random()*28;
  this.rot = (Math.random()-0.5)*0.3;
  this.rotV = (Math.random()-0.5)*0.02;
  this.life = 1;
  this.decay = 0.003 + Math.random()*0.005;
  this.color = 'hsl('+(270+Math.random()*60)+','+(60+Math.random()*40)+'%,'+(70+Math.random()*20)+'%)';
  this.mode = mode;
  this.scale = 1;
  this.scaleV = mode===1 ? (Math.random()-0.5)*0.02 : 0;
  // 流れるモード用
  this.floatAmp = 20+Math.random()*40;
  this.floatFreq = 0.5+Math.random()*1.5;
  this.floatOff = Math.random()*Math.PI*2;
  this.startX = this.x;
  this.age = 0;
}

Particle.prototype.update = function(){
  this.age++;
  var t = this.age/60;

  if(this.mode===0){
    // 流れる：横に流れながらふわふわ
    this.x += this.vx*0.8;
    this.y += this.vy*0.3;
    this.y += Math.sin(t*this.floatFreq+this.floatOff)*0.5;
    // 画面端でループ
    if(this.x > W+100) this.x=-100;
    if(this.x < -100) this.x=W+100;
    if(this.y < -50) this.y=H+50;
    if(this.y > H+50) this.y=-50;
    this.life = 1; // 消えない

  } else if(this.mode===1){
    // 崩れる：文字がばらけていく
    this.x += this.vx;
    this.y += this.vy;
    this.vx += (Math.random()-0.5)*0.3;
    this.vy += 0.05;
    this.rot += this.rotV;
    this.scale += this.scaleV;
    this.life -= this.decay*0.5;
    this.alpha = Math.max(0,this.life);

  } else if(this.mode===2){
    // 爆発：勢いよく飛び散る
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.15;
    this.vx *= 0.98;
    this.rot += this.rotV*3;
    this.life -= this.decay*1.5;
    this.alpha = Math.max(0,this.life);

  } else if(this.mode===3){
    // 静寂→爆発：ゆっくり→急加速
    var burst = this.age > 90;
    if(burst){
      this.x += this.vx*3;
      this.y += this.vy*3;
      this.vy += 0.2;
      this.life -= this.decay*2;
    } else {
      this.x += this.vx*0.1;
      this.y += this.vy*0.1;
      this.vx *= 0.95; this.vy *= 0.95;
    }
    this.rot += this.rotV*(burst?4:0.2);
    this.alpha = Math.max(0,this.life);
  }

  return this.life > 0;
};

Particle.prototype.draw = function(ctx){
  ctx.save();
  ctx.translate(this.x, this.y);
  ctx.rotate(this.rot);
  ctx.scale(this.scale, this.scale);
  ctx.globalAlpha = this.alpha;
  ctx.font = 'bold '+this.size+'px "Hiragino Sans","Yu Gothic",sans-serif';
  ctx.fillStyle = this.color;
  ctx.shadowColor = this.color;
  ctx.shadowBlur = 12;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(this.word, 0, 0);
  ctx.restore();
};

// ── spawn ────────────────────────────────────────────────────
function spawn(word, x, y){
  if(!word) word = words[Math.floor(Math.random()*words.length)];
  particles.push(new Particle(word, x, y, mode));
}

function burst(cx, cy){
  var count = 15 + Math.floor(Math.random()*15);
  for(var i=0;i<count;i++){
    var w = words[Math.floor(Math.random()*words.length)];
    var p = new Particle(w, cx||W/2, cy||H/2, 2);
    p.vx = (Math.random()-0.5)*20;
    p.vy = (Math.random()-0.5)*20 - 5;
    p.size = 18+Math.random()*40;
    particles.push(p);
  }
  intensity = 3.0;
}

function initMode(){
  particles = [];
  if(mode===0){
    // 画面に常時30個流す
    for(var i=0;i<30;i++){
      var w=words[Math.floor(Math.random()*words.length)];
      spawn(w);
    }
  } else if(mode===3){
    silenceTimer = 0;
    exploding = false;
  }
}

// ── loop ─────────────────────────────────────────────────────
function loop(){
  renderGL();
  ctx.clearRect(0,0,W,H);

  // intensityを徐々に戻す
  intensity += (1.0-intensity)*0.05;

  // モード3の静寂→爆発サイクル
  if(mode===3){
    silenceTimer++;
    if(!exploding && silenceTimer > 180){
      exploding=true;
      burst(W/2,H/2);
      silenceTimer=0;
    }
    if(exploding && particles.length===0){
      exploding=false;
      silenceTimer=0;
    }
    // 静寂中：中央にゆっくり集まる言葉
    if(!exploding && silenceTimer%30===0 && words.length>0){
      var w=words[Math.floor(Math.random()*words.length)];
      var p=new Particle(w, W/2+(Math.random()-0.5)*200, H/2+(Math.random()-0.5)*100, 3);
      p.size=20+Math.random()*20;
      p.color='hsl(290,50%,85%)';
      particles.push(p);
    }
  }

  // モード0: 常時補充
  if(mode===0 && particles.length<30){
    spawn(words[Math.floor(Math.random()*words.length)]);
  }

  // モード1/2: ランダムに追加
  if((mode===1||mode===2) && Math.random()<0.05 && words.length>0){
    spawn(words[Math.floor(Math.random()*words.length)]);
  }

  // update & draw
  particles = particles.filter(function(p){
    var alive = p.update();
    if(alive||mode===0) p.draw(ctx);
    return alive;
  });

  requestAnimationFrame(loop);
}
loop();

// ── input ────────────────────────────────────────────────────
var input = document.getElementById('word-input');

function addWord(){
  var w = input.value.trim();
  if(!w) return;
  if(words.indexOf(w)===-1) words.push(w);
  // 画面にも出す
  var cx=W/2+(Math.random()-0.5)*200;
  var cy=H/3+(Math.random()-0.5)*100;
  if(mode===2){
    burst(cx,cy);
  } else {
    for(var i=0;i<5;i++) spawn(w, cx+(Math.random()-0.5)*100, cy+(Math.random()-0.5)*80);
  }
  input.value='';
}

document.getElementById('btn-add').addEventListener('click',addWord);
input.addEventListener('keydown',function(e){
  if(e.key==='Enter'){ e.preventDefault(); addWord(); }
});

// プリセットタグ
document.querySelectorAll('.wtag').forEach(function(tag){
  tag.addEventListener('click',function(){
    var w=tag.textContent;
    if(words.indexOf(w)===-1) words.push(w);
    var cx=W/2+(Math.random()-0.5)*300;
    var cy=H/2+(Math.random()-0.5)*200;
    if(mode===2){ burst(cx,cy); }
    else { for(var i=0;i<6;i++) spawn(w,cx+(Math.random()-0.5)*80,cy+(Math.random()-0.5)*60); }
  });
});

// モード切替
document.querySelectorAll('[data-mode]').forEach(function(btn){
  btn.addEventListener('click',function(){
    mode=parseInt(btn.dataset.mode);
    document.querySelectorAll('[data-mode]').forEach(function(b){
      b.classList.toggle('active',b===btn);
    });
    initMode();
  });
});

// キーボード
window.addEventListener('keydown',function(e){
  if(e.target===input) return;
  if(e.code==='Space'){ e.preventDefault(); burst(W/2,H/2); }
  if(e.key==='c'||e.key==='C'){ particles=[]; words=['尊い']; }
  if(e.key==='s'||e.key==='S') saveFrame();
  if(e.key>='1'&&e.key<='4'){
    mode=parseInt(e.key)-1;
    document.querySelectorAll('[data-mode]').forEach(function(b,i){
      b.classList.toggle('active',i===mode);
    });
    initMode();
  }
});

// クリックで爆発
cv.style.pointerEvents='none';
glc.addEventListener('click',function(e){
  if(e.target.closest('#ui')) return;
  burst(e.clientX,e.clientY);
});

// save
function saveFrame(){
  var tmp=document.createElement('canvas');
  tmp.width=W;tmp.height=H;
  var tc=tmp.getContext('2d');
  var px=new Uint8Array(W*H*4);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,px);
  var id=tc.createImageData(W,H);
  for(var y=0;y<H;y++){
    var s=(H-1-y)*W*4;
    id.data.set(px.subarray(s,s+W*4),y*W*4);
  }
  tc.putImageData(id,0,0);
  tc.drawImage(cv,0,0);
  tmp.toBlob(function(blob){
    var a=document.createElement('a');
    var ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
    a.download='bl_text_'+ts+'.png';
    a.href=URL.createObjectURL(blob);
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  },'image/png');
}
</script>
</body>
</html>
