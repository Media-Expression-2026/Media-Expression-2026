<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 5000;
        const SPEED_MULT = 0.2;
        const AUTO_SPIN = false;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.SphereGeometry(0.3, 16, 16);
        const material = new THREE.ShaderMaterial({
    uniforms: {},
    vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vColor;
        void main() {
            vec4 mvPosition = modelViewMatrix * instanceMatrix * vec4(position, 1.0);
            vNormal = normalize(normalMatrix * normal);
            vViewPosition = -mvPosition.xyz;
            vColor = instanceColor;
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec3 vColor;
        void main() {
            float fresnel = dot(vNormal, normalize(vViewPosition));
            fresnel = clamp(1.0 - fresnel, 0.0, 1.0);
            fresnel = pow(fresnel, 2.0);
            vec3 col = vColor * fresnel + vec3(0.1); 
            gl_FragColor = vec4(col, 0.3 + fresnel * 0.7);
        }
    `,
    transparent: true, blending: 2, depthWrite: false
});
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"scale":75,"speed":0.4,"morph":1,"hueOffset":0.65};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const scale = addControl("scale", "Hyper Scale", 10, 150, 75);
                 const speed = addControl("speed", "Phase Speed", 0.01, 2.0, 0.4);
                 const morph = addControl("morph", "4D Morph", 0.0, 2.0, 1.0);
                 const hueOffset = addControl("hueOffset", "Hue Rotation", 0.0, 1.0, 0.65);
                 
                 const t = time * speed;
                 const n = i / count;
                 
                 const a = n * Math.PI * 2.0;
                 const b = i * 2.399963229728653;
                 
                 const w = Math.sin(t * 0.7 + n * Math.PI * 4.0) * morph;
                 const cosW = Math.sqrt(Math.max(0.001, 1.0 - w * w * 0.25));
                 
                 const r1 = scale * (0.6 + 0.4 * Math.sin(b * 3.0 + t));
                 const r2 = scale * (0.6 + 0.4 * Math.cos(a * 5.0 - t));
                 
                 const x = r1 * Math.cos(a) * cosW;
                 const y = r1 * Math.sin(a) * cosW;
                 const z = r2 * Math.cos(b + t * 1.5) + (w * scale * 0.6);
                 
                 const foldX = x * Math.cos(t * 0.3) - z * Math.sin(t * 0.3);
                 const foldZ = x * Math.sin(t * 0.3) + z * Math.cos(t * 0.3);
                 const foldY = y * Math.cos(t * 0.4) - foldZ * Math.sin(t * 0.4);
                 const finalZ = y * Math.sin(t * 0.4) + foldZ * Math.cos(t * 0.4);
                 
                 target.set(foldX, foldY, finalZ);
                 
                 const h = (hueOffset + n * 0.3 + w * 0.25 + t * 0.15) - Math.floor(hueOffset + n * 0.3 + w * 0.25 + t * 0.15);
                 const s = 0.6 + 0.4 * Math.abs(Math.sin(a * 3.0 - t));
                 const l = 0.2 + 0.7 * Math.max(0.0, Math.min(1.0, (finalZ + scale * 1.5) / (scale * 3.0)));
                 
                 color.setHSL(h, s, l);
                 
                 if (i === 0) {
                 setInfo("Hyper-Dimensional Tesseract", "A breathing projection of a 4D Clifford Torus folding through 3D space.");
                 annotate("center", new THREE.Vector3(0, 0, 0), "Dimensional Rift");
                 }
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
