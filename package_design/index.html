<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Package Design Template</title>
<style>
/* ── 画面表示用 ── */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #2a2a2a;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: system-ui, sans-serif;
  gap: 24px;
  padding: 40px 20px;
}

/* コントロールパネル */
#controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 16px 20px;
  max-width: 600px;
  width: 100%;
}
.ctrl-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ctrl-group label {
  font-size: 9px;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  font-family: 'Courier New', monospace;
}
.ctrl-group input[type=text],
.ctrl-group input[type=color],
.ctrl-group select {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 4px;
  color: #fff;
  font-size: 12px;
  padding: 6px 10px;
  outline: none;
  font-family: inherit;
}
.ctrl-group input[type=color] {
  width: 48px; height: 32px;
  padding: 2px;
  cursor: pointer;
}
.ctrl-group input[type=text] { width: 160px; }

#btn-print {
  padding: 8px 20px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 4px;
  color: #fff;
  font-size: 11px;
  letter-spacing: 0.12em;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  transition: background 0.15s;
}
#btn-print:hover { background: rgba(255,255,255,0.2); }

/* ── A6カード ── */
#card-wrap {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  width: 354px;   /* A6 148mm @ 96dpi ≈ 354px */
  height: 248px;  /* A6 105mm @ 96dpi ≈ 248px（横向き） */
  position: relative;
  overflow: hidden;
  border-radius: 6px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  cursor: pointer;
  transition: transform 0.2s;
}
.card:hover { transform: scale(1.02); }

/* 背景 */
.card-bg {
  position: absolute;
  inset: 0;
  background: var(--bg-color, #F4A535);
}

/* 内枠 */
.card-border {
  position: absolute;
  inset: 7px;
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 3px;
  pointer-events: none;
}

/* シリーズ名 */
.card-series {
  position: absolute;
  top: 14px;
  left: 0; right: 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.25em;
  color: rgba(255,255,255,0.85);
  font-family: 'Georgia', serif;
  text-transform: uppercase;
}

/* イラストエリア */
.card-illust {
  position: absolute;
  top: 28px;
  left: 50%;
  transform: translateX(-50%);
  width: 130px;
  height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-illust img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.card-illust-placeholder {
  width: 100px;
  height: 100px;
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  letter-spacing: 0.1em;
  text-align: center;
  line-height: 1.6;
}

/* キャラ名 */
.card-name {
  position: absolute;
  bottom: 36px;
  left: 12px; right: 12px;
  text-align: center;
  font-family: 'Georgia', 'Times New Roman', serif;
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 0.08em;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
  text-transform: uppercase;
  line-height: 1;
}

/* キャッチコピー */
.card-copy {
  position: absolute;
  bottom: 18px;
  left: 0; right: 0;
  text-align: center;
  font-size: 8px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.75);
  font-family: 'Georgia', serif;
  font-style: italic;
}

/* ロゴエリア */
.card-logo {
  position: absolute;
  bottom: 10px;
  left: 14px;
  font-size: 6px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.4);
  font-family: 'Courier New', monospace;
}

/* ── 印刷用 ── */
@media print {
  body {
    background: #fff;
    padding: 0;
    margin: 0;
  }
  #controls, #hint { display: none !important; }
  #card-wrap {
    gap: 0;
    page-break-inside: avoid;
  }
  .card {
    width: 148mm;
    height: 105mm;
    box-shadow: none;
    border-radius: 0;
    transform: none !important;
  }
  .card:hover { transform: none; }
}
</style>
</head>
<body>

<!-- コントロール -->
<div id="controls">
  <div class="ctrl-group">
    <label>背景色</label>
    <input type="color" id="c-bg" value="#F4A535">
  </div>
  <div class="ctrl-group">
    <label>シリーズ名</label>
    <input type="text" id="c-series" value="MEDIA EXPRESSION" maxlength="30">
  </div>
  <div class="ctrl-group">
    <label>キャラ名</label>
    <input type="text" id="c-name" value="ZUNDAMON" maxlength="16">
  </div>
  <div class="ctrl-group">
    <label>キャッチコピー</label>
    <input type="text" id="c-copy" value="Looking for a world." maxlength="40">
  </div>
  <div class="ctrl-group">
    <label>URL / SNS</label>
    <input type="text" id="c-url" value="@mediaexpression2026" maxlength="30">
  </div>
  <div class="ctrl-group">
    <label>画像</label>
    <input type="file" id="c-img" accept="image/*"
      style="font-size:10px;color:rgba(255,255,255,0.5);background:none;border:none;cursor:pointer;">
  </div>
  <button id="btn-print">🖨 印刷</button>
</div>

<!-- カードプレビュー -->
<div id="card-wrap">
  <div class="card" id="card">
    <div class="card-bg" id="card-bg"></div>
    <div class="card-border"></div>
    <div class="card-series" id="card-series">MEDIA EXPRESSION</div>
    <div class="card-illust" id="card-illust">
      <div class="card-illust-placeholder">イラスト<br>ここに配置</div>
    </div>
    <div class="card-name" id="card-name">ZUNDAMON</div>
    <div class="card-copy" id="card-copy">Looking for a world.</div>
    <div class="card-logo" id="card-logo">@mediaexpression2026</div>
  </div>
</div>

<div id="hint" style="font-size:10px;color:rgba(255,255,255,0.2);letter-spacing:0.12em;font-family:'Courier New',monospace;">
  値を変えるとリアルタイムでプレビューが更新される　／　印刷ボタンでA6サイズで印刷
</div>

<script>
// リアルタイム更新
function bind(id, fn){
  document.getElementById(id).addEventListener('input', fn);
}

bind('c-bg', function(e){
  document.getElementById('card-bg').style.background = e.target.value;
});
bind('c-series', function(e){
  document.getElementById('card-series').textContent = e.target.value.toUpperCase();
});
bind('c-name', function(e){
  document.getElementById('card-name').textContent = e.target.value.toUpperCase();
});
bind('c-copy', function(e){
  document.getElementById('card-copy').textContent = e.target.value;
});
bind('c-url', function(e){
  document.getElementById('card-logo').textContent = e.target.value;
});

// 画像アップロード
document.getElementById('c-img').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var illust = document.getElementById('card-illust');
    illust.innerHTML = '<img src="'+ev.target.result+'" alt="character">';
  };
  reader.readAsDataURL(file);
});

// 印刷
document.getElementById('btn-print').addEventListener('click', function(){
  window.print();
});

// カードクリックで背景色をランダムに変える
var palettes = [
  '#F4A535','#E8556D','#4A7FC1','#6AB04C',
  '#A855A8','#3ABFBF','#E87C3E','#8B5CF6',
  '#EC4899','#10B981','#F59E0B','#6366F1',
];
var pi = 0;
document.getElementById('card').addEventListener('click', function(e){
  if(e.target.closest('#controls')) return;
  pi = (pi+1) % palettes.length;
  var col = palettes[pi];
  document.getElementById('card-bg').style.background = col;
  document.getElementById('c-bg').value = col;
});
</script>
</body>
</html>
